# Colors (Everforest Dark Hard)

[colors.primary]
background = '#1e2326'  # bg_dim: más oscuro que Thunar (#272e33)
foreground = '#d3c6aa'

[colors.normal]
black   = '#414b50'
red     = '#e67e80'
green   = '#a7c080'
yellow  = '#dbbc7f'
blue    = '#7fbbb3'
magenta = '#d699b6'
cyan    = '#83c092'
white   = '#d3c6aa'

[colors.bright]
black   = '#859289'  # grey1: zsh-autosuggestions/comentarios legibles
red     = '#e67e80'
green   = '#a7c080'
yellow  = '#dbbc7f'
blue    = '#7fbbb3'
magenta = '#d699b6'
cyan    = '#83c092'
white   = '#d3c6aa'

[colors.selection]
background = '#495156'  # bg4: gris, no el morado de bg_visual
text       = '#d3c6aa'

[colors.search.matches]
background = '#a7c080'
foreground = '#272e33'

[colors.search.focused_match]
background = '#e67e80'
foreground = '#272e33'
