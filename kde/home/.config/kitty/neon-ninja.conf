# Neon Ninja: kitty.conf plus this theme's look. Keys, cursor, selection and scrolling stay in kitty.conf.
# Opened by the theme's terminal: kitty --config ~/.config/kitty/neon-ninja.conf
include kitty.conf

# conf.d/neon-ninja.fish and the prompt look for these, so other terminals keep their setup
env NEON_NINJA=1
env STARSHIP_CONFIG=${HOME}/.config/starship-neon-ninja.toml

font_family      family="Moralerspace Neon"
bold_font        family="Moralerspace Neon" style="Bold"
italic_font      family="Moralerspace Neon" style="Italic"
bold_italic_font family="Moralerspace Neon" style="Bold Italic"

# Darker than the windows behind it
background_opacity 0.88

foreground           #d5d6e0
background           #050507
cursor               #ff2e4d
cursor_text_color    #050507
selection_foreground #ffffff
selection_background #c8203c
url_color            #7aa2f7

color0  #16161d
color1  #ff2e4d
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9adc0
color8  #414868
color9  #ff5c74
color10 #b0e27c
color11 #f2c27e
color12 #94b5ff
color13 #cdb2ff
color14 #a4daff
color15 #d5d6e0
color16 #ff9e64
color17 #db4b4b

tab_bar_style           separator
tab_separator           " "
tab_bar_background      #0b0b10
active_tab_foreground   #ffffff
active_tab_background   #c8203c
inactive_tab_foreground #6b6d7c
inactive_tab_background #16161d
active_border_color     #ff2e4d
inactive_border_color   #16161d
bell_border_color       #ff9e64

# From the repo's Alacritty: a line break for programs that take it, like Claude Code
map shift+enter send_text all \x1b\r
