<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- rofi no lee xsettings y se quedaba en el hintslight de 10-hinting-slight.conf:
       autohinter de FreeType, ~100 ms más al abrir. hintfull = lo que usa el escritorio (Xft/HintStyle) -->
  <match target="pattern">
    <test name="prgname"><string>rofi</string></test>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
</fontconfig>
