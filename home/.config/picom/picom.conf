backend = "glx";
vsync = true;
use-damage = true;
shadow = false;
corner-radius = 0;

animations = (
  { triggers = [ "open", "show" ]; preset = "appear"; scale = 0.92; duration = 0.15; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.92; duration = 0.12; },
  # experimental: también anima al arrastrar y al recolocar del mosaico
  { triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.15; }
);

rules = (
  { match = "window_type = 'dock' || window_type = 'desktop'"; animations = (); }
);
