# /tmp es RAM: en el OOM del 2026-09-28 llegó a 5,4 GB. Con tope da "sin espacio" en vez de tumbar la sesión.
# Copia las opciones de systemd 262 cambiando solo size: revisar al actualizar systemd (systemctl cat tmp.mount).
[Mount]
Options=mode=1777,strictatime,nosuid,nodev,size=25%%,nr_inodes=1m,x-systemd.graceful-option=usrquota
