# Solo lo que difiere de los valores por defecto de TLP 1.10; /etc/tlp.conf queda de fábrica
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
# El firmware de Dell ofrece cool/quiet/balanced/performance: el low-power de antes fallaba en silencio
PLATFORM_PROFILE_ON_BAT=quiet
START_CHARGE_THRESH_BAT0=95
STOP_CHARGE_THRESH_BAT0=100
# El códec dormido se come el primer pitido de las notificaciones (0,26 s)
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=10
# Batería al 12 %: un apagón en seco pierde como mucho 15 s de escritura (60 por defecto)
MAX_LOST_WORK_SECS_ON_BAT=15
# QCA9377: su ahorro de energía y el runtime PM agravan los cuelgues. TLP es el único dueño
# (NetworkManager lo deja en "ignore"); con batería TLP lo encendería por defecto.
WIFI_PWR_ON_BAT=off
RUNTIME_PM_DENYLIST="02:00.0"
