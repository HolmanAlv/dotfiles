# Lo de este equipo, encima de 90-base.cfg (arch-base)
# 10 s: la partición de pruebas (hoy Pond) se elige a mano
GRUB_TIMEOUT=10
GRUB_THEME="/boot/grub/themes/pond/theme.txt"
# Pond guarda sus imágenes en assets/ y 00_header solo carga png si están en la raíz del tema
GRUB_PRELOAD_MODULES="$GRUB_PRELOAD_MODULES png"
# retbleed=stuff (necesita retpoline): mitigación "equilibrada" para este Kaby Lake, más barata que IBRS en cada syscall
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT spectre_v2=retpoline retbleed=stuff"
