# /etc/default/grub queda de fábrica (GRUB_DEFAULT=0: Arch siempre por defecto); lo propio va aquí
GRUB_TIMEOUT=10
GRUB_THEME="/boot/grub/themes/pond/theme.txt"
# Pond guarda sus imágenes en assets/ y 00_header solo carga png si están en la raíz del tema
GRUB_PRELOAD_MODULES="$GRUB_PRELOAD_MODULES png"
# Sin esto, linux-lts pasaría a ser la entrada por defecto
GRUB_TOP_LEVEL="/boot/vmlinuz-linux"
# El microcódigo ya va dentro del initramfs (hook microcode): no cargarlo dos veces
GRUB_EARLY_INITRD_LINUX_STOCK=""
# zswap encima de zram comprime dos veces y salía en los fallos de memoria.
# retbleed=stuff (necesita retpoline): mitigación "equilibrada", más barata que IBRS en cada syscall.
# Sin "loglevel=3 quiet" de fábrica: los mensajes del kernel y los [ OK ] de systemd salen hasta lightdm.
GRUB_CMDLINE_LINUX_DEFAULT="zswap.enabled=0 spectre_v2=retpoline retbleed=stuff"
