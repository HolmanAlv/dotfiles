# lightdm.conf queda de fábrica; lo propio va aquí
[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=xfce
# Corre como root: por eso vive en /usr/lib y no en ~ (antes ~/.screenlayout/autoscreen2k.sh, editable por el usuario)
display-setup-script=/usr/lib/inspdell/display-setup
# Si el OOM del kernel tiene que actuar, que elija una app y no Xorg (el 2026-09-28 mató Xorg y con él la sesión).
# No mata nada nuevo, y la sesión no lo hereda: no es hija de Xorg.
xserver-command=choom -n -900 -- X
